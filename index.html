<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#111317">
<title>Expenses</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --bg:#111317; --card:#1A1D23; --line:#2C3038; --soft:#22262D; --text:#ECEEF1; --muted:#9AA3AE; --dim:#B7BEC7;
          --accent:#F2B354; --ok:#5EC4B6; --over:#FF8A65; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button { touch-action:manipulation; -webkit-text-size-adjust:100%; }  /* no double-tap zoom, fast taps */
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); min-height:100vh; }
  button, input { font-family:inherit; font-size:inherit; color:inherit; }
  button { cursor:pointer; }
  .wrap { max-width:480px; margin:0 auto; padding:14px 20px 20px; display:flex; flex-direction:column; gap:16px; }
  .eyebrow { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card { background:var(--card); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .big { font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-.02em; }
  .muted { color:var(--muted); } .dim { color:var(--dim); }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar > div { height:100%; border-radius:4px; }
  .primary { height:56px; border-radius:28px; border:none; background:var(--accent); color:#111317; font-size:17px; font-weight:600; width:100%; }
  .ghost { height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:transparent; font-size:14px; }
  .field { height:44px; border-radius:12px; border:1px solid var(--line); background:var(--card); padding:0 14px; font-size:16px; width:100%; min-width:0; }
  label.f { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); }
  .chips { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .chip { min-height:42px; border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:500; line-height:1.15; padding:4px; }
  .chip.on { border-color:var(--accent); background:#2A2418; }
  .inc { --accent:#5EC4B6; } .inc .chip.on { background:#16302C; }
  .seg { display:flex; background:var(--card); border-radius:22px; padding:4px; gap:4px; }
  .seg button { height:36px; padding:0 16px; border-radius:18px; border:none; background:transparent; color:var(--dim); font-size:14px; font-weight:600; }
  .seg button.on { background:var(--accent); color:#111317; }
  .chip.new { border-style:dashed; background:transparent; color:var(--dim); }
  .modes { display:flex; gap:8px; }
  .mode { white-space:nowrap; padding:0 6px; height:36px; border-radius:20px; border:1px solid var(--line); background:transparent; font-size:13px; font-weight:500; }
  .mode.on { background:var(--line); border-color:var(--muted); }
  .keys { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .key { height:40px; border-radius:14px; border:none; background:var(--card); font-size:24px; font-weight:500; }
  .key:active { background:var(--line); }
  .entry { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--soft); width:100%; background:none; border-left:none; border-right:none; border-top:none; text-align:left; }
  .entry small { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .del { height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--over); background:transparent; color:var(--over); font-size:13px; }
  nav { position:fixed; left:0; right:0; bottom:0; background:rgba(17,19,23,.96); border-top:1px solid var(--soft);
        padding:8px 12px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-around; }
  nav button { flex:1; height:52px; border:none; background:none; color:var(--muted); font-size:12px; font-weight:500;
               display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  nav button.on { color:var(--text); }
  nav button svg { width:22px; height:22px; }
  .toast { position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--text); color:#111317;
           padding:10px 16px; border-radius:20px; font-size:14px; font-weight:500; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  .hbars { display:flex; flex-direction:column; gap:10px; }
  .hbar { display:grid; grid-template-columns:118px 1fr 76px; align-items:center; gap:10px; font-size:14px; }
  .hidden { display:none !important; }
  .who { display:flex; background:var(--card); border-radius:22px; padding:4px; gap:4px; }
  .who button { flex:1; height:36px; border-radius:18px; border:none; background:transparent; color:var(--dim); font-size:14px; font-weight:600; }
  .who button.on { background:var(--text); color:#111317; }
  .badge { width:26px; height:26px; border-radius:13px; color:#111317; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pick { height:96px; border-radius:18px; border:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:600; }
  .pick.on { border:2px solid var(--accent); }
  .catrow { display:grid; grid-template-columns:1fr 110px 44px; gap:8px; align-items:center; }
  .iconbtn { width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="hidden">
  <button data-tab="month" aria-label="This month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</button>
  <button data-tab="add" aria-label="Add expense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
  <button data-tab="summary" aria-label="Summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Summary</button>
  <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// ---------------- storage on this device ----------------
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let cfg = LS.get("em.cfg", null);           // { api, pin }
let queue = LS.get("em.queue", []);          // expenses saved while offline
let cats = LS.get("em.cats", []);            // expense categories [{name, budget}]
let incCats = LS.get("em.incCats", []);      // income categories [{name}]
const APP_VERSION = "1.7";
// ---- the house: two people, each signed in with their own PIN ----
let users = LS.get("em.users", [{ id: "shivam", name: "Shivam" }, { id: "wife", name: "Wife" }]);
const me = () => (cfg && cfg.user) || "shivam";
const userName = (id) => (users.find((u) => u.id === id) || { name: id }).name;
const USER_COLORS = ["#C9A96E", "#B7949E"];
const userColor = (id) => USER_COLORS[Math.max(0, users.findIndex((u) => u.id === id)) % USER_COLORS.length];
const ownerOf = (e) => e.owner || "shivam";
// whose numbers are on screen: "home" (both added up) or one person
const viewList = (list) => (state.who === "home" ? list : list.filter((e) => ownerOf(e) === state.who));
// a category's budget for the person on screen (Home adds both up)
function budgetOf(c, who = state.who) {
  if (!c.budgets) return c.budget || 0;
  return who === "home" ? Object.values(c.budgets).reduce((a, b) => a + (b || 0), 0) : c.budgets[who] || 0;
}
const badge = (id) => `<span class="badge" style="background:${userColor(id)}" aria-label="${esc(userName(id))}">${esc(userName(id).charAt(0))}</span>`;
const MODES = ["UPI", "Credit card", "Debit card", "Cash", "Auto-debit"];
const isCC = (e) => !isInc(e) && e.mode === "Credit card";
const isInc = (e) => e.kind === "income";
const spends = (l) => l.filter((e) => !isInc(e));
const incomes = (l) => l.filter(isInc);
const catsFor = (k) => (k === "income" ? incCats : cats);
// Each category keeps the same soft colour: by its place in Settings, or a stable pick for old names.
const PALETTE = ["#C9A96E", "#7FB3A8", "#8FA3C7", "#B7949E", "#A3B38A", "#C49A7A", "#9C93C4", "#8DB0C2"];
function catColor(name) {
  const i = cats.findIndex((c) => c.name === name);
  if (i >= 0) return PALETTE[i % PALETTE.length];
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
const dot = (name) => `<span aria-hidden="true" style="width:8px;height:8px;border-radius:4px;flex-shrink:0;background:${catColor(name)}"></span>`;
let monthCache = LS.get("em.month", {});     // last loaded month, for instant start

const state = {
  tab: "month",
  view: startOfMonth(new Date()),            // month shown on Month / Summary
  expenses: [], prev: [],                    // this month, previous month
  add: { kind: "expense", amt: "0", cat: null, mode: "UPI", note: "", date: "", adding: false, draft: "" },
  edit: null,                               // the entry being edited, if any
  who: "home",                               // Home | a person
  pick: "shivam",                            // profile chosen on the sign-in screen
};

// ---------------- small helpers ----------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
function monthName(d) { return d.toLocaleString("en-IN", { month: "long" }); }
function monthKey(d) { return d.getFullYear() + "-" + (d.getMonth() + 1); }
function sameMonth(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }
function dateStr(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayStr() { return dateStr(new Date()); }
const form = () => state.edit || state.add;
function timeLabel(ts) {
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return t;
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }

// ---------------- talking to the server ----------------
async function api(path, opts = {}) {
  const res = await fetch(cfg.api + path, {
    ...opts,
    headers: { "X-PIN": cfg.pin, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (res.status === 401) throw Object.assign(new Error("Wrong PIN"), { code: 401 });
  if (res.status === 429) throw Object.assign(new Error("Too many wrong PINs. Try again in 15 minutes."), { code: 429 });
  if (res.status === 403) { const b = await res.json().catch(() => ({})); throw Object.assign(new Error(b.message || "That entry belongs to someone else."), { code: 403 }); }
  if (res.status === 400) throw Object.assign(new Error("The server didn't accept that entry"), { code: 400 });
  if (!res.ok) throw new Error("Server error (" + res.status + ")");
  return path === "/api/export" ? res.text() : res.json();
}
function range(d) { return "from=" + d.getTime() + "&to=" + addMonths(d, 1).getTime(); }

async function loadMonth() {
  const [cur, prev] = await Promise.all([
    api("/api/expenses?" + range(state.view)),
    api("/api/expenses?" + range(addMonths(state.view, -1))),
  ]);
  // keep offline entries visible until they reach the server
  const ids = new Set(cur.map((e) => e.id));
  const mine = queue.filter((e) => !ids.has(e.id) && e.ts >= state.view.getTime() && e.ts < addMonths(state.view, 1).getTime());
  state.expenses = mine.concat(cur).sort((a, b) => b.ts - a.ts);
  state.prev = prev;
  if (sameMonth(state.view, new Date())) { monthCache = { key: monthKey(state.view), cur: state.expenses, prev }; LS.set("em.month", monthCache); }
}
async function loadMe() {
  const r = await api("/api/me");
  users = r.users; LS.set("em.users", users);
  if (cfg.user !== r.user) { cfg.user = r.user; LS.set("em.cfg", cfg); }
}
async function loadCats() {
  [cats, incCats] = await Promise.all([api("/api/categories?kind=expense"), api("/api/categories?kind=income")]);
  LS.set("em.cats", cats); LS.set("em.incCats", incCats);
}

async function flushQueue() {
  if (!cfg || !queue.length) return;
  for (const e of queue.slice()) {
    try { await api("/api/expenses", { method: "POST", body: JSON.stringify(e) }); queue = queue.filter((q) => q.id !== e.id); LS.set("em.queue", queue); }
    catch (err) {
      if (err.code === 400 || err.code === 403) { queue = queue.filter((q) => q.id !== e.id); LS.set("em.queue", queue); continue; } // bad entry: drop it
      if (err.code) throw err;
      return; // offline: try again later
    }
  }
}

async function refresh(quiet) {
  try { await loadMe(); await flushQueue(); await Promise.all([loadCats(), loadMonth()]); render(); }
  catch (err) {
    if (err.code === 401) { cfg = null; LS.set("em.cfg", null); render(); toast("PIN changed — please enter it again"); return; }
    if (!quiet) toast(err.code === 429 ? err.message : "Offline — showing saved data");
    render();
  }
}

// ---------------- screens ----------------
function render() {
  $("#nav").classList.toggle("hidden", !cfg);
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
  const app = $("#app");
  if (!cfg) { app.innerHTML = setupView(); return; }
  if (state.edit) { app.innerHTML = addView(state.edit, true); return; }
  app.innerHTML = { month: monthView, add: addView, summary: summaryView, settings: settingsView }[state.tab]();
}

function setupView() {
  return `<div class="wrap" style="padding-top:48px">
    <span class="eyebrow">Home</span>
    <div class="big" style="font-size:32px">Who's using this phone?</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      ${users.map((u) => `<button class="pick ${state.pick === u.id ? "on" : ""}" data-act="pick" data-id="${esc(u.id)}" style="--accent:${userColor(u.id)}">${badge(u.id).replace("26px", "36px")}${esc(u.name)}</button>`).join("")}</div>
    <label class="f">${esc(userName(state.pick))}'s PIN<input id="sPin" class="field" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <button class="primary" data-act="connect">Sign in</button>
    <p class="muted" style="margin:0;font-size:13px;line-height:1.5">Each of you has your own PIN. Everything you add is tagged to you; you can both see the whole house.</p>
    <details class="muted" style="font-size:13px"><summary>Server address</summary>
      <input id="sApi" class="field" type="url" inputmode="url" autocomplete="off" value="${esc((cfg && cfg.api) || LS.get("em.api", "https://expense-manager.twominutetrails.workers.dev"))}" style="margin-top:8px" aria-label="Server address"></details>
    <p id="sErr" class="muted" style="margin:0;font-size:14px"></p></div>`;
}

function totals(list) { const t = {}; list.forEach((e) => { t[e.category] = (t[e.category] || 0) + e.amount; }); return t; }
function sum(list) { return list.reduce((s, e) => s + e.amount, 0); }

function whoSwitch() {
  return `<div class="who" role="group" aria-label="Whose numbers">${[{ id: "home", name: "Home" }].concat(users).map((u) =>
    `<button data-act="who" data-who="${esc(u.id)}" class="${state.who === u.id ? "on" : ""}">${esc(u.name)}</button>`).join("")}</div>`;
}
function monthView() {
  const L = viewList(state.expenses), home = state.who === "home", other = !home && state.who !== me();
  const spent = sum(spends(L)), income = sum(incomes(L));
  const onCC = sum(L.filter(isCC)), fromAccount = spent - onCC;
  const budget = cats.reduce((s, c) => s + budgetOf(c), 0);
  const isNow = sameMonth(state.view, new Date());
  const now = new Date();
  const daysInMonth = new Date(state.view.getFullYear(), state.view.getMonth() + 1, 0).getDate();
  const daysLeft = isNow ? daysInMonth - now.getDate() + 1 : 0;
  const left = budget - spent;
  const t = totals(spends(L));
  const names = cats.map((c) => c.name);
  Object.keys(t).forEach((n) => { if (!names.includes(n)) names.push(n); });
  const rows = names.map((n) => {
    const b = budgetOf(cats.find((c) => c.name === n) || {}), s = t[n] || 0;
    return { n, s, b };
  }).filter((r) => r.s > 0 || r.b > 0).sort((a, b) => b.s - a.s);
  const pct = budget ? Math.min(100, Math.round(spent / budget * 100)) : 0;
  const people = home ? users.map((u) => { const l = state.expenses.filter((e) => ownerOf(e) === u.id);
    return `<div class="row" style="font-size:13px"><span style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:8px;height:8px;border-radius:4px;background:${userColor(u.id)}"></span>${esc(u.name)}</span><span class="dim">${inr(sum(incomes(l)))} in · ${inr(sum(spends(l)))} spent</span></div>`; }).join("") : "";
  return `<div class="wrap">
    ${whoSwitch()}
    ${other ? `<div class="row" style="justify-content:flex-start;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--dim)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Viewing ${esc(userName(state.who))}'s month · view only</div>` : ""}
    <div class="row"><button class="ghost" data-act="prevMonth" aria-label="Previous month">‹</button>
      <span class="eyebrow">${esc(monthName(state.view))} ${state.view.getFullYear()}</span>
      <button class="ghost" data-act="nextMonth" aria-label="Next month" ${isNow ? "disabled style='opacity:.3'" : ""}>›</button></div>
    ${income ? `<div class="card">
      <span class="muted" style="font-size:13px">${home ? "Home · left this month" : "Left this month"}</span>
      <span class="big" style="font-size:40px;color:${income - fromAccount < 0 ? "var(--over)" : "var(--ok)"}">${income - fromAccount < 0 ? "−" : ""}${inr(Math.abs(income - fromAccount))}</span>
      <div style="display:grid;grid-template-columns:repeat(${onCC ? 3 : 2},minmax(0,1fr));gap:10px">
        <div><span class="muted" style="font-size:12px;display:block">Income</span><span style="font-size:16px;font-weight:600">${inr(income)}</span></div>
        <div><span class="muted" style="font-size:12px;display:block">${onCC ? "Paid from account" : "Spent"}</span><span style="font-size:16px;font-weight:600">${inr(fromAccount)}</span></div>
        ${onCC ? `<div><span class="muted" style="font-size:12px;display:block">On credit card</span><span style="font-size:16px;font-weight:600;color:#8FA3C7">${inr(onCC)}</span></div>` : ""}</div>
      ${onCC ? `<span class="muted" style="font-size:12px;line-height:1.4">Credit card spends count in the budget, but aren't taken from income.</span>` : ""}

function summarySentences(all, prevAll) {
  const out = [], cur = spends(all), prev = spends(prevAll);
  const home = state.who === "home", mine = state.who === me();
  const subj = home ? "Together you" : mine ? "You" : userName(state.who), poss = home || mine ? "your" : "their";
  const income = sum(incomes(all)), onCC = sum(all.filter(isCC)), spentAll = sum(cur) - onCC;
  if (income) {
    const kept = income - spentAll;
    out.push(kept >= 0 ? `${subj} kept ${inr(kept)} of ${poss} ${inr(income)} income (${Math.round(kept / income * 100)}%).`
                       : `${subj} spent ${inr(-kept)} more than ${home || mine ? "you" : "they"} earned this month.`);
  }
  if (onCC) out.push(`${inr(onCC)} went on ${home ? "credit cards" : poss + " credit card"} — counted as spending, not yet taken from income.`);
  const tc = totals(cur), tp = totals(prev);
  const ranked = Object.entries(tc).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return out.length ? out : ["Nothing logged this month."];
  const [topName, topAmt] = ranked[0];
  const topDiff = topAmt - (tp[topName] || 0);
  out.push(`${topName} was ${poss} biggest spend at ${inr(topAmt)}` + (prev.length && topDiff !== 0 ? `, ${topDiff > 0 ? "up" : "down"} ${inr(Math.abs(topDiff))} from last month.` : "."));
  const over = cats.filter((c) => budgetOf(c) && (tc[c.name] || 0) > budgetOf(c));
  if (over.length) out.push(over.map((c) => `${c.name} went ${inr(tc[c.name] - budgetOf(c))} over budget`).join("; ") + ".");
  else if (cats.some((c) => budgetOf(c))) out.push("Every category stayed within its budget.");
  if (prev.length) {
    const all = new Set(Object.keys(tc).concat(Object.keys(tp)));
    let up = null, down = null;
    all.forEach((n) => { if (n === topName) return; const d = (tc[n] || 0) - (tp[n] || 0);
      if (d > 0 && (!up || d > up[1])) up = [n, d]; if (d < 0 && (!down || d < down[1])) down = [n, d]; });
    if (up) out.push(`${up[0]} rose ${inr(up[1])} compared with last month.`);
    if (down) out.push(`${down[0]} dropped ${inr(-down[1])} compared with last month.`);
  }
  return out;
}

// ---------------- actions ----------------
function readCatRows(listId = "catList") {
  return Array.from(document.querySelectorAll("#" + listId + " .catrow")).map((row) => {
    const b = row.querySelector('[data-k="budget"]');
    return { name: row.querySelector('[data-k="name"]').value.trim(),
             budget: b ? Math.max(0, Math.round(Number(b.value.replace(/[^0-9]/g, "")) || 0)) : 0 };
  });
}
async function saveCatsList(list, msg, kind = "expense") {
  // rows from Settings carry this person's budget; rows straight from the server carry everyone's
  const clean = list.filter((c) => c.name).map((c) => ({ name: c.name, budget: c.budgets ? budgetOf(c, me()) : c.budget || 0 }));
  const names = clean.map((c) => c.name.toLowerCase());
  if (!clean.length) return toast("Keep at least one category");
  if (new Set(names).size !== names.length) return toast("Two categories have the same name");
  try {
    const saved = await api("/api/categories?kind=" + kind, { method: "PUT", body: JSON.stringify(clean) });
    if (kind === "income") { incCats = saved; LS.set("em.incCats", incCats); } else { cats = saved; LS.set("em.cats", cats); }
    toast(msg || "Saved");
  }
  catch (e) { toast(e.code ? e.message : "You're offline — try again when connected"); }
  render();
}

async function onAction(btn) {
  const act = btn.dataset.act, a = form();
  if (act === "pick") { state.pick = btn.dataset.id; const p = $("#sPin").value; render(); $("#sPin").value = p; $("#sPin").focus(); return; }
  if (act === "who") { state.who = btn.dataset.who; return render(); }
  if (act === "connect") {
    const apiUrl = $("#sApi").value.trim().replace(/\/+$/, ""), pin = $("#sPin").value.trim();
    if (!/^https:\/\//.test(apiUrl) || !pin) { $("#sErr").textContent = "Enter your PIN."; return; }
    cfg = { api: apiUrl, pin };
    try {
      const r = await api("/api/me");
      if (r.user !== state.pick) { cfg = null; $("#sErr").textContent = "That PIN isn't " + userName(state.pick) + "'s."; return; }
      cfg.user = r.user; users = r.users; LS.set("em.users", users); LS.set("em.cfg", cfg); LS.set("em.api", apiUrl);
      state.who = "home"; await refresh();
    }
    catch (e) { cfg = null; $("#nav").classList.add("hidden"); $("#sErr").textContent = e.code ? e.message : "Couldn't reach the server. Check the address."; }
    return;
  }
  if (act === "key") {
    const k = btn.dataset.k;
    if (k === "del") a.amt = a.amt.length > 1 ? a.amt.slice(0, -1) : "0";
    else if (a.amt.length < 8) a.amt = a.amt === "0" ? (k === "00" ? "0" : k) : a.amt + k;
    $("#aAmt").textContent = inr(Number(a.amt)); return;
  }
  if (act === "cat") { keepAddInputs(); a.cat = btn.dataset.name; return render(); }
  if (act === "mode") { keepAddInputs(); a.mode = btn.dataset.mode; return render(); }
  if (act === "kind") { keepAddInputs(); if (a.kind !== btn.dataset.kind) { a.kind = btn.dataset.kind; a.cat = null; a.adding = false; } return render(); }
  if (act === "newCat") { keepAddInputs(); a.adding = true; a.draft = ""; render(); const i = $("#aNew"); if (i) i.focus(); return; }
  if (act === "cancelCat") { a.adding = false; return render(); }
  if (act === "saveCat") {
    const n = ($("#aNew").value || "").trim().slice(0, 40);
    a.adding = false;
    if (!n) return render();
    const list = catsFor(a.kind);
    if (list.some((c) => c.name.toLowerCase() === n.toLowerCase())) { a.cat = list.find((c) => c.name.toLowerCase() === n.toLowerCase()).name; return render(); }
    a.cat = n;
    return saveCatsList(list.concat([{ name: n, budget: 0 }]), "Added " + n, a.kind);
  }
  if (act === "save") {
    keepAddInputs();
    const amount = Number(a.amt);
    if (!amount) return toast("Enter an amount");
    if (!a.cat) return toast("Pick a category");
    const now = new Date(), [y, m, d] = a.date.split("-").map(Number);
    let when;
    if (state.edit) {
      const o = new Date(a.origTs);   // keep the original time of day
      when = a.date === a.origDate ? o : new Date(y, m - 1, d, o.getHours(), o.getMinutes());
    } else when = a.date === todayStr() ? now : new Date(y, m - 1, d, 12, 0);
    const inc = a.kind === "income";
    const e = { id: state.edit ? a.id : crypto.randomUUID(), ts: when.getTime(), amount, category: a.cat, mode: inc ? "" : a.mode, note: a.note.trim(), kind: a.kind, owner: me() };
    queue = queue.filter((q) => q.id !== e.id).concat([e]); LS.set("em.queue", queue);
    if (state.edit) {
      state.expenses = state.expenses.filter((x) => x.id !== e.id);
      if (sameMonth(new Date(e.ts), state.view)) state.expenses = state.expenses.concat([e]).sort((p, q) => q.ts - p.ts);
      state.edit = null; render(); toast("Updated " + (inc ? "+" : "") + inr(amount) + " · " + e.category);
      try { await flushQueue(); } catch (err) {}
      return render();
    }
    if (sameMonth(new Date(e.ts), state.view)) state.expenses = [e].concat(state.expenses).sort((p, q) => q.ts - p.ts);
    state.add = { kind: a.kind, amt: "0", cat: a.cat, mode: a.mode, note: "", date: todayStr(), adding: false, draft: "" };
    render(); toast("Saved " + (inc ? "+" : "") + inr(amount) + " · " + e.category);
    try { await flushQueue(); } catch (err) {}
    if (state.tab === "month") render();
    return;
  }
  if (act === "prevMonth" || act === "nextMonth") {
    state.view = addMonths(state.view, act === "prevMonth" ? -1 : 1);
    state.expenses = []; state.prev = []; render(); return refresh();
  }
  if (act === "openEntry") {
    const e = state.expenses.find((x) => x.id === btn.dataset.id);
    if (!e || ownerOf(e) !== me()) return;
    const ds = dateStr(new Date(e.ts));
    state.edit = { kind: e.kind || "expense", id: e.id, amt: String(e.amount), cat: e.category, mode: e.mode === "Card" ? "Debit card" : e.mode || "UPI", note: e.note || "", date: ds, origDate: ds, origTs: e.ts, adding: false, draft: "" };
    window.scrollTo(0, 0); return render();
  }
  if (act === "cancelEdit") { state.edit = null; return render(); }
  if (act === "delete") {
    const id = btn.dataset.id;
    if (queue.some((q) => q.id === id)) { queue = queue.filter((q) => q.id !== id); LS.set("em.queue", queue); }
    try { await api("/api/expenses/" + encodeURIComponent(id), { method: "DELETE" }); }
    catch (e) { return toast(e.code ? e.message : "You're offline — delete when connected"); }
    state.expenses = state.expenses.filter((x) => x.id !== id); state.edit = null; render(); toast("Deleted"); return;
  }
  const listId = btn.dataset.list || "catList", listKind = listId === "incList" ? "income" : "expense";
  const setList = (rows) => { const other = listKind === "income" ? "catList" : "incList", otherRows = readCatRows(other);
    if (listKind === "income") { incCats = rows; cats = otherRows; } else { cats = rows; incCats = otherRows; } };
  if (act === "addCatRow") { setList(readCatRows(listId).concat([{ name: "", budget: 0 }])); render(); const last = document.querySelectorAll("#" + listId + ' [data-k="name"]'); last[last.length - 1].focus(); return; }
  if (act === "rmCat") { const rows = readCatRows(listId); rows.splice(Number(btn.dataset.i), 1); setList(rows); return render(); }
  if (act === "saveCats") return saveCatsList(readCatRows(listId), "Saved", listKind);
  if (act === "export") {
    try {
      const csv = await api("/api/export");
      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = "expenses-" + todayStr() + ".csv";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 5000);
    } catch (e) { toast(e.code ? e.message : "You're offline — try again when connected"); }
    return;
  }
  if (act === "logout") {
    if (queue.length) { try { await flushQueue(); } catch (e) {} }
    if (queue.length) return toast("Some entries haven't synced yet — connect to the internet first");
    LS.set("em.api", cfg.api); cfg = null; LS.set("em.cfg", null); LS.set("em.month", {}); queue = []; LS.set("em.queue", []); state.tab = "month"; state.who = "home"; state.expenses = []; state.prev = []; render();
  }
}
function keepAddInputs() {
  const n = $("#aNote"), d = $("#aDate"), c = $("#aNew");
  const f = form();
  if (n) f.note = n.value; if (d && d.value) f.date = d.value; if (c) f.draft = c.value;
}

document.addEventListener("click", (ev) => {
  const tab = ev.target.closest("nav button");
  if (tab) { keepAddInputs(); state.tab = tab.dataset.tab; state.edit = null; render(); if (tab.dataset.tab !== "add") refresh(true); return; }
  const btn = ev.target.closest("[data-act]");
  if (btn) onAction(btn);
});
document.addEventListener("change", (ev) => { if (ev.target.id === "aDate" && ev.target.value) form().date = ev.target.value; });
window.addEventListener("online", () => refresh(true));
document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg) refresh(true); });

// ---------------- updates ----------------
// Phones keep a saved copy of the app for a while. This asks GitHub for the
// newest copy and, if its version is different, reloads into it.
async function checkForUpdate() {
  try {
    const res = await fetch("./index.html?check=" + Date.now(), { cache: "no-store" });
    const m = (await res.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) location.replace("./?v=" + encodeURIComponent(m[1]));
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });

// ---------------- no pinch-zoom ----------------
// iPhone Safari ignores the viewport setting, so block the zoom gestures directly.
["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ---------------- start ----------------
if (cfg && monthCache.key === monthKey(state.view)) { state.expenses = monthCache.cur || []; state.prev = monthCache.prev || []; }
render();
if (cfg) refresh(true);
checkForUpdate();
</script>
</body>
