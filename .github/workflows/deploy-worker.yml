# Sends the server code to Cloudflare whenever it changes on main.
name: Deploy server to Cloudflare
on:
  push:
    branches: [main]
    paths: ["worker/**", "wrangler.toml", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            APP_PIN
        env:
          APP_PIN: ${{ secrets.EXPENSE_PIN }}
